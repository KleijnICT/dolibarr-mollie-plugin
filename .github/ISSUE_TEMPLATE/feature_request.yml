name: Feature request
description: Suggest an improvement to the module.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation in which you miss something, rather than only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: markdown
    attributes:
      value: |
        Note that some things are out of scope by design: payment methods are managed in the Mollie dashboard (no per-method code),
        and Mollie payouts and transaction fees are not reconciled inside Dolibarr. See "Known limitations" in the README.
